name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check (${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          # The transcript tailer and file paths are exercised on macOS too.
          - os: macos-latest
            node: 22
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # 3D assets (packages/web/public/assets) are Git LFS files
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: make install
      - name: make check (format, typecheck, arch, coverage ≥70%, E2E, build)
        run: make check
      - name: Coverage summary
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e '
              const s = require("./coverage/coverage-summary.json").total;
              const row = (k) => `| ${k} | ${s[k].pct}% |`;
              console.log(["### Coverage", "| metric | % |", "|---|---|", ...["statements","branches","functions","lines"].map(row)].join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always() && matrix.os == 'ubuntu-latest' && matrix.node == 22
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  app-smoke:
    name: app-smoke (${{ matrix.os }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true # 3D assets (packages/web/public/assets) are Git LFS files
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make install
      - name: Electron system libraries and virtual display (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb libgtk-3-0 libnss3 libasound2t64 libgbm1
      - run: make build
      - name: Drive the built app with Playwright
        run: make test-ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-${{ matrix.os }}
          path: |
            packages/desktop/playwright-report/
            packages/desktop/test-results/
          if-no-files-found: ignore
