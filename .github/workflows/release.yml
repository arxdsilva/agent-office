name: Release

# Builds installers for every OS when a version tag is pushed and attaches them to a DRAFT
# GitHub release (publish it manually). Signing/notarization run only when the secrets exist.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # Never ship installers from a commit that fails the checks (format, typecheck, arch, coverage,
  # backend E2E, build). The slower app-smoke job gates main in ci.yml: tag only a green commit.
  verify:
    name: verify (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # 3D assets (packages/web/public/assets) are Git LFS files
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: make install
      - run: make check

  build:
    name: build (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # 3D assets (packages/web/public/assets) are Git LFS files
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
      - name: Package and publish to the draft release
        run: pnpm --filter @agent-office/desktop exec electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing (macOS Developer ID / Windows certificate) and Apple notarization.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
