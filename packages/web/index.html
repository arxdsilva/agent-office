<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="agent-office-token" content="" />
    <title>agent-office</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="stage"></div>

    <header id="hud" class="card">
      <div class="hud-title">
        <span id="conn" class="dot" title="connecting"></span>
        <strong>agent-office</strong>
        <span id="count" class="muted">0 agents</span>
      </div>
      <ul id="legend"></ul>
      <p class="muted hint">Drag to orbit · scroll to zoom · click an agent to chat</p>
    </header>

    <div id="actions">
      <button id="fit" class="btn" type="button" title="Fit the whole office in view">⤢ Fit</button>
      <button id="walk" class="btn" type="button" title="Walk around (F)">🚶 Walk</button>
    </div>

    <div id="crosshair" hidden></div>
    <p id="walk-help" class="card" hidden>WASD move · Shift sprint · E talk to agent · Esc exit</p>

    <aside id="panel" class="card" hidden aria-live="polite">
      <div class="panel-head">
        <div>
          <h2 id="p-name"></h2>
          <p id="p-sub" class="muted"></p>
        </div>
        <button id="p-close" class="icon-btn" type="button" aria-label="Close">✕</button>
      </div>
      <dl id="p-meta"></dl>
      <p id="p-hint" class="hint-box" hidden></p>
      <ol id="p-thread"></ol>
      <form id="p-form">
        <textarea
          id="p-input"
          rows="2"
          maxlength="4000"
          placeholder="Message this agent… (Enter to send)"
        ></textarea>
        <div class="form-row">
          <span id="p-error" class="error"></span>
          <span id="p-counter" class="muted">0/4000</span>
          <button class="btn primary" type="submit">Send</button>
        </div>
      </form>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
